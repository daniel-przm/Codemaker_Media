<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plantilla · Portadas de destacadas</title>
<link rel="stylesheet" href="base.css">
<style>
  /*
   * Portada de una historia destacada: 1080×1920, pero Instagram solo enseña
   * un círculo del centro. Así que solo lleva un icono, centrado; el nombre
   * de la destacada lo pone Instagram debajo del círculo.
   */
  .d-portada .icono { position: absolute; top: 50%; left: 50%; width: 460px; height: 460px;
                      transform: translate(-50%, -50%); filter: brightness(0) invert(1); }
</style>
</head>
<body>
<script src="comun.js"></script>
<script>
  montar(window.DATOS.portadas.map((p) =>
    nombrar(lamina('vertical d-portada', icono(p.icono)), p.nombre)));
</script>
</body>
</html>
